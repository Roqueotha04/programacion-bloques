:root{
  --bg:#EAF6FE; --bg2:#F6FBFF; --panel:#FFFFFF; --line:#D3EAF8; --line2:#B5DCF2;
  --cel:#2FB0F0; --cel-d:#1689C9; --cel-l:#BDE8FF; --glow:#57E1FF; --ink:#0D3049; --muted:#5F7F96;
  --mov:#3B82F0; --mov-d:#2563C9; --ctl:#FF9A2E; --ctl-d:#D9780F; --evt:#FFC83D; --evt-d:#DDA312;
  --star:#FFC21A; --red:#FF5A62; --ok:#1EC48C; --ok-d:#11986A; --pink:#FF6FB5; --vio:#8B6CF0;
  --pnt:#A35BD6; --pnt-d:#7E3DB0; --paint:#4C8DF6;
  --t:480ms; --cs:64px; --hole:#fff;
  color-scheme:light;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Lexend","Segoe UI",system-ui,sans-serif; font-weight:500;
  background-image:linear-gradient(rgba(47,176,240,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,176,240,.07) 1px,transparent 1px);
  background-size:28px 28px;
}
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
button:focus-visible{ outline:3px solid var(--glow); outline-offset:3px; border-radius:12px; }
h1,h2,h3,h4{ margin:0; font-weight:700; }
.hidden{ display:none !important; }

/* ---------- fondo animado ---------- */
.sky{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.sky i{ position:absolute; bottom:-90px; left:var(--x); width:var(--s); height:var(--s); border-radius:50%; background:var(--c); opacity:.2; animation:drift var(--d) linear infinite; animation-delay:var(--dl); }
.sky i.st{ border-radius:0; clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); opacity:.3; }
@keyframes drift{ from{ transform:translateY(0) rotate(0); } to{ transform:translateY(calc(-100vh - 180px)) rotate(360deg); } }

/* ---------- barra superior ---------- */
.top{
  position:sticky; top:0; z-index:20; height:64px; display:flex; align-items:center; gap:14px; padding:0 18px; color:#fff;
  background:linear-gradient(100deg,#1597DF,#2FB0F0,#5ED3FF,#8B6CF0,#FF6FB5,#2FB0F0); background-size:300% 100%;
  animation:topflow 16s ease-in-out infinite alternate; box-shadow:0 4px 18px rgba(22,137,201,.25);
}
@keyframes topflow{ from{ background-position:0 0; } to{ background-position:100% 0; } }
.top::after{ content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 22px); }
.top .grow{ flex:1; }
.profe{ background:#FFC21A; color:#4A3300; font-size:14px; padding:4px 12px; border-radius:999px; box-shadow:0 3px 0 #DDA312; }
.logo{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:21px; }
.logo svg{ width:42px; height:42px; overflow:visible; }
.tbtn{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.6); padding:7px 16px 7px 12px; border-radius:999px; font-weight:600; font-size:16px; color:#fff; position:relative; z-index:1; }
.tbtn:hover{ background:rgba(255,255,255,.32); }
.tbtn svg{ width:20px; height:20px; }
.ttitle{ display:flex; align-items:center; gap:10px; font-size:20px; font-weight:600; min-width:0; }
.ttitle .badge{ width:36px; height:36px; border-radius:50%; background:#fff; color:var(--cel-d); display:grid; place-items:center; font-weight:700; flex:none; }
.ttitle .badge svg{ width:24px; height:24px; }
.ttitle #tName{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tstars{ display:flex; gap:4px; }
.tstars svg{ width:30px; height:30px; }
.wallet{ display:flex; align-items:center; gap:6px; background:#fff; color:var(--ink); border-radius:999px; padding:4px 16px 4px 6px; font-weight:700; font-size:20px; box-shadow:0 3px 0 rgba(13,48,73,.18); position:relative; z-index:1; flex:none; }
.wallet svg{ width:32px; height:32px; animation:twinkle 2.4s ease-in-out infinite; }
.wallet.bump{ animation:bump .35s; }
@keyframes twinkle{ 0%,100%{ transform:rotate(0) scale(1); } 50%{ transform:rotate(18deg) scale(1.12); } }
@keyframes bump{ 40%{ transform:scale(1.25); } }

/* ---------- menú ---------- */
.menu{ max-width:1100px; margin:0 auto; padding:26px 22px 60px; }
.hero{ display:flex; align-items:center; gap:24px; background:#fff; border:1.5px solid var(--line); border-radius:28px; padding:22px 28px; box-shadow:0 12px 30px rgba(22,137,201,.10); position:relative; overflow:hidden; flex-wrap:wrap; }
.hero::before{ content:""; position:absolute; right:-80px; top:-80px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(255,111,181,.25),transparent 70%); animation:glowmove 6s ease-in-out infinite alternate; }
.hero::after{ content:""; position:absolute; left:30%; bottom:-120px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(87,225,255,.3),transparent 70%); animation:glowmove 7s ease-in-out infinite alternate-reverse; }
@keyframes glowmove{ to{ transform:translate(-60px,30px) scale(1.2); } }
.hero .bigbot{ width:118px; height:118px; flex:none; animation:wiggle 3.2s ease-in-out infinite; overflow:visible; position:relative; z-index:1; }
@keyframes wiggle{ 0%,100%{ transform:translateY(-3%) rotate(-4deg); } 50%{ transform:translateY(4%) rotate(4deg); } }
.hero .htxt{ position:relative; z-index:1; flex:1; min-width:240px; }
.hero h1{ font-size:clamp(28px,4vw,42px); }
.hero h1 .word{ display:inline-block; white-space:nowrap; font-weight:inherit; }
.hero h1 span{ display:inline-block; animation:wave 2.6s ease-in-out infinite; animation-delay:calc(var(--i)*.07s); }
@keyframes wave{ 0%,55%,100%{ transform:translateY(0); } 25%{ transform:translateY(-7px); } }
.hero p{ margin:8px 0 0; color:var(--muted); font-size:18px; }
.herobtns{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.shopbtn{ display:inline-flex; align-items:center; gap:10px; padding:8px 18px 8px 8px; border-radius:18px; background:linear-gradient(135deg,#FF9A2E,#FF6FB5); color:#fff; font-weight:700; font-size:18px; box-shadow:0 5px 0 #D2557F; }
.shopbtn svg{ width:38px; height:38px; }
.shopbtn:hover{ filter:brightness(1.06); }
.shopbtn:active{ transform:translateY(4px); box-shadow:none; }
.resetbtn{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:12px; color:var(--muted); font-weight:600; font-size:14px; border:1.5px solid var(--line); background:#fff; }
.resetbtn svg{ width:18px; height:18px; }
.resetbtn:hover{ background:#FFF0F1; color:var(--red); border-color:#FFC7CB; }
.resetbtn.ask{ background:var(--red); color:#fff; border-color:var(--red); animation:bump .5s ease-in-out infinite; }
.total{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:17px; color:var(--muted); }
.total svg{ width:28px; height:28px; }
.sec{ display:flex; align-items:center; gap:12px; margin:34px 0 4px; flex-wrap:wrap; }
.sec .sico{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; }
.sec .sico svg{ width:30px; height:30px; }
.sec h2{ font-size:26px; }
.sec span.sub{ color:var(--muted); font-size:16px; }
.grp{ --gc:var(--cel); --gl:var(--cel-l); margin:16px 0 6px; background:rgba(255,255,255,.6); border:2px solid var(--line); border-radius:26px; padding:14px 16px 20px; position:relative; }
.grph{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.gdot{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--gc); box-shadow:0 4px 0 rgba(13,48,73,.15); flex:none; }
.gdot svg{ width:28px; height:28px; }
.grph h3{ font-size:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.grph .gsub{ color:var(--muted); font-size:15px; }
.gprog{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:17px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:4px 14px 4px 6px; }
.gprog svg{ width:26px; height:26px; }
.lockchip{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; background:#FFF4E5; border:1.5px solid #FFD199; color:#9A5A00; padding:5px 14px 5px 8px; border-radius:999px; font-weight:700; font-size:15px; }
.lockchip svg{ width:22px; height:22px; }
.newtag{ background:var(--red); color:#fff; font-size:13px; padding:3px 9px; border-radius:999px; animation:bump .8s ease-in-out infinite; }
.grp.locked .cards{ filter:grayscale(.9); opacity:.55; }
.card.new{ animation:cardIn .5s cubic-bezier(.3,1.6,.5,1) backwards,newgrp 1.3s ease-in-out .5s 3; animation-delay:calc(var(--i,0)*40ms),.5s; }
.card.locked{ filter:grayscale(.9); opacity:.6; }
.card .need{ display:inline-flex; align-items:center; gap:4px; background:#FFF4E5; border:1.5px solid #FFD199; color:#9A5A00; padding:3px 10px; border-radius:999px; font-weight:700; font-size:13px; position:relative; z-index:1; }
.card .need svg{ width:16px; height:16px; }
@keyframes newgrp{ 50%{ box-shadow:0 0 0 6px var(--star),0 0 34px var(--star); } }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(186px,1fr)); gap:16px; }
.card{ position:relative; background:#fff; border:2px solid var(--line); border-radius:22px; padding:18px 14px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .15s,box-shadow .15s; box-shadow:0 6px 16px rgba(22,137,201,.08);
  animation:cardIn .5s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay:calc(var(--i,0)*40ms); }
@keyframes cardIn{ from{ opacity:0; transform:scale(.55) translateY(24px); } }
.card:hover{ transform:translateY(-5px) rotate(-1.5deg); border-color:var(--gc,var(--cel)); box-shadow:0 12px 26px rgba(22,137,201,.2); }
.card.s3{ border-color:#FFD75E; background:linear-gradient(#fff,#FFF8DD); }
.card .num{ position:absolute; top:-12px; left:-10px; width:34px; height:34px; border-radius:50%; background:var(--gc,var(--cel)); color:#fff; display:grid; place-items:center; font-weight:700; font-size:18px; box-shadow:0 0 0 4px var(--gl,var(--cel-l)); }
.card h3{ font-size:17px; text-align:center; line-height:1.2; }
.card .stars{ display:flex; gap:3px; }
.card .stars svg{ width:26px; height:26px; }
.card.locked{ cursor:not-allowed; }
.card.locked:hover{ transform:none; }
.card .lock{ position:absolute; inset:0; display:grid; place-items:start center; padding-top:34px; border-radius:20px; background:rgba(255,255,255,.3); }
.card .lock svg{ width:46px; height:46px; }
.card.no, .skin.no{ animation:shake .4s; }
.mini{ display:grid; gap:2px; background:#D2ECFA; padding:3px; border-radius:8px; }
.mini i{ display:block; width:var(--ms,14px); height:var(--ms,14px); background:#F8FDFF; border-radius:3px; }
.mini i.r{ background:#8DA3B7; } .mini i.R{ background:var(--cel); border-radius:50%; } .mini i.E{ background:var(--star); } .mini i.B{ background:var(--ok); }
.mini i.X{ background:#FF5A62; } .mini i.V{ background:#1EC48C; border-radius:50%; }
.card.make .plus{ width:86px; height:86px; border-radius:18px; border:3px dashed var(--line2); display:grid; place-items:center; color:var(--cel); font-size:46px; font-weight:700; }
.toast{ position:fixed; left:50%; bottom:26px; z-index:300; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff; padding:12px 22px 12px 14px; border-radius:18px; font-weight:600; font-size:18px; box-shadow:0 12px 30px rgba(13,48,73,.35); animation:toastIn .35s cubic-bezier(.3,1.6,.5,1); max-width:calc(100vw - 32px); }
.toast svg{ width:30px; height:30px; flex:none; }
@keyframes toastIn{ from{ transform:translate(-50%,40px) scale(.8); opacity:0; } }

/* ---------- desafío extra (una card con 3 niveles contra reloj) ---------- */
.chcard{ position:relative; width:100%; display:flex; align-items:center; gap:16px; flex-wrap:wrap; text-align:left; padding:16px 18px; border-radius:22px; border:2px solid #CBBDFF; background:linear-gradient(120deg,#F4F0FF,#FFF6E0); box-shadow:0 6px 16px rgba(139,108,240,.15);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .15s; animation:cardIn .5s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay:calc(var(--i,0)*40ms); }
.chcard+.chcard{ margin-top:16px; }
.chcard:hover{ transform:translateY(-4px); box-shadow:0 12px 26px rgba(139,108,240,.25); }
.chcard.s3{ border-color:#FFD75E; }
.chcard.new{ animation:cardIn .5s cubic-bezier(.3,1.6,.5,1) backwards,newgrp 1.3s ease-in-out .5s 3; animation-delay:calc(var(--i,0)*40ms),.5s; }
.chcard.locked{ filter:grayscale(.9); opacity:.6; cursor:not-allowed; }
.chcard.locked:hover{ transform:none; }
.chcard.no{ animation:shake .4s; }
.chico{ width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#8B6CF0,#FF6FB5); display:grid; place-items:center; flex:none; box-shadow:0 4px 0 rgba(13,48,73,.15); }
.chico svg{ width:42px; height:42px; }
.chtxt{ flex:1; min-width:200px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
.chtag{ background:#8B6CF0; color:#fff; font-size:13px; font-weight:700; padding:2px 10px; border-radius:999px; }
.chtxt h3{ font-size:20px; }
.chsub{ color:var(--muted); font-size:15px; }
.chrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:2px; }
.chrow .stars{ display:flex; gap:3px; }
.chrow .stars svg{ width:26px; height:26px; }
.chbest{ display:inline-flex; align-items:center; gap:4px; font-weight:700; font-size:15px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:2px 10px 2px 4px; }
.chbest svg{ width:20px; height:20px; }
.chcard .need{ display:inline-flex; align-items:center; gap:4px; background:#FFF4E5; border:1.5px solid #FFD199; color:#9A5A00; padding:3px 10px; border-radius:999px; font-weight:700; font-size:13px; }
.chcard .need svg{ width:16px; height:16px; }
.chmaps{ display:flex; gap:10px; align-items:center; }
@media (max-width:640px){ .chmaps{ display:none; } }
.ttimer{ display:flex; align-items:center; gap:6px; background:#fff; color:var(--ink); border-radius:999px; padding:4px 14px 4px 6px; font-weight:700; font-size:20px; box-shadow:0 3px 0 rgba(13,48,73,.18); position:relative; z-index:1; flex:none; font-variant-numeric:tabular-nums; }
.ttimer svg{ width:28px; height:28px; }

/* ---------- juego: estilo Scratch ---------- */
.ide{ display:grid; grid-template-columns:86px 236px minmax(280px,1fr) minmax(360px,470px); gap:12px; padding:12px; height:calc(100vh - 64px); min-height:620px; }
@media (max-width:1150px){ .ide{ grid-template-columns:80px 220px 1fr; height:auto; } .ide .stage{ grid-column:1/-1; } .ide .script{ min-height:520px; } }
.panel{ background:#fff; border:1.5px solid var(--line); border-radius:20px; box-shadow:0 8px 24px rgba(22,137,201,.08); min-height:0; }
.cats{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 5px; }
.cat{ display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted); padding:9px 2px; border-radius:14px; width:100%; }
.cat i{ width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px var(--line2); }
.cat.on{ background:var(--bg2); color:var(--ink); }
.pal{ padding:14px 16px; overflow:auto; --hole:#fff; transition:background .15s; }
.pal h4{ margin:2px 0 14px; font-size:17px; display:flex; align-items:center; gap:8px; }
.pal h4 i{ width:14px; height:14px; border-radius:50%; }
.pgroup{ display:flex; flex-direction:column; align-items:flex-start; gap:18px; margin-bottom:26px; }
.pal .blk{ transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
.pal .blk:hover{ transform:translateX(4px) rotate(-1.5deg) scale(1.03); }
.pal.drop{ background:#FFF1F2; box-shadow:inset 0 0 0 3px var(--red); }
.script{ display:flex; flex-direction:column; overflow:hidden; position:relative; }
.sbar{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1.5px solid var(--line); flex-wrap:wrap; }
.sbar h3{ font-size:17px; }
.pill{ display:inline-flex; align-items:center; gap:6px; background:var(--bg2); border:1.5px solid var(--line); border-radius:999px; padding:4px 12px; font-weight:700; font-size:16px; transition:background .2s,border-color .2s; }
.pill svg{ width:20px; height:20px; }
.pill.full{ background:#FFF1DF; border-color:var(--ctl); color:#9A5A00; }
.pill.bump{ animation:bump .35s; }
.pill.no{ animation:shake .4s; background:#FFE3E5; border-color:var(--red); color:#B3202A; }
.clear{ margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-weight:600; font-size:14px; padding:6px 10px; border-radius:10px; }
.clear svg{ width:20px; height:20px; }
.clear:hover{ background:#FFF0F1; color:var(--red); }
.clear.ask{ background:var(--red); color:#fff; }
.canvas{
  flex:1; overflow:auto; position:relative; padding:22px 22px 130px; --hole:var(--bg2); background-color:var(--bg2);
  background-image:radial-gradient(circle,#C6E2F4 1.3px,transparent 1.6px); background-size:22px 22px; background-attachment:local;
}
.list.root{ min-height:60px; }
.rootph{ display:flex; align-items:center; gap:10px; width:240px; height:54px; padding:0 14px; border:2.5px dashed var(--line2); border-radius:10px; color:var(--muted); font-weight:600; font-size:15px; background:rgba(255,255,255,.6); animation:phpulse 1.6s ease-in-out infinite; }
@keyframes phpulse{ 50%{ border-color:var(--cel); background:rgba(189,232,255,.5); } }
.rootph svg{ width:34px; height:34px; flex:none; }
.trash{ position:absolute; right:18px; bottom:18px; width:66px; height:66px; border-radius:50%; background:#fff; border:2px solid var(--line); display:grid; place-items:center; box-shadow:0 6px 14px rgba(22,137,201,.15); transition:transform .15s,background .15s; }
.trash svg{ width:34px; height:34px; }
.trash.hot{ background:var(--red); border-color:var(--red); transform:scale(1.18) rotate(-8deg); }
.trash.hot svg *{ stroke:#fff; }
.dropline{ position:absolute; height:7px; width:160px; border-radius:4px; background:var(--glow); box-shadow:0 0 0 2px #fff,0 0 14px var(--glow); pointer-events:none; z-index:6; animation:linepulse .6s ease-in-out infinite alternate; }
@keyframes linepulse{ to{ box-shadow:0 0 0 2px #fff,0 0 24px var(--glow),0 0 4px var(--pink); } }

/* bloques (forma de pieza de rompecabezas) */
.blk{
  position:relative; display:flex; align-items:center; gap:10px; width:max-content; min-width:158px; height:54px; padding:0 20px 0 11px;
  background:var(--c); color:#fff; border-radius:10px; box-shadow:inset 0 -5px 0 var(--cd); font-weight:600; font-size:19px;
  cursor:grab; user-select:none; touch-action:none;
}
.blk::before{ content:""; position:absolute; top:0; left:18px; width:32px; height:8px; background:var(--hole); clip-path:polygon(0 0,100% 0,76% 100%,24% 100%); z-index:1; }
.blk::after{ content:""; position:absolute; bottom:-8px; left:18px; width:32px; height:8px; background:var(--cd); clip-path:polygon(0 0,100% 0,76% 100%,24% 100%); z-index:2; }
.blk .ic{ width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.2); display:grid; place-items:center; flex:none; }
.blk .ic svg{ width:25px; height:25px; }
.mov{ --c:var(--mov); --cd:var(--mov-d); }
.act{ --c:var(--pnt); --cd:var(--pnt-d); }
/* bloque si: misma forma que repetir, con selector de color */
.colsel{ display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--ink); border-radius:999px; padding:3px 12px 3px 5px; font-size:17px; font-weight:700; }
.colsel i{ width:22px; height:22px; border-radius:50%; background:var(--cc); box-shadow:inset 0 0 0 2px rgba(13,48,73,.18); }
button.colsel:hover{ box-shadow:0 0 0 3px rgba(255,255,255,.6); }
.iff.yes>.rtop{ box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ok),0 0 18px var(--ok); }
.iff.nope>.rtop{ box-shadow:0 0 0 3px #fff,0 0 0 6px #9DB2C4; filter:saturate(.5); }
.hat{ --c:var(--evt); --cd:var(--evt-d); color:#4A3300; height:66px; padding-top:8px; border-radius:30px 14px 10px 10px / 26px 14px 10px 10px; cursor:default; min-width:190px; }
.hat::before{ display:none; }
.hat .ic{ background:rgba(255,255,255,.55); }
.blk.rep{ display:block; height:auto; padding:0; background:none; box-shadow:none; min-width:0; --c:var(--ctl); --cd:var(--ctl-d); }
.rep>.rtop{ position:relative; display:flex; align-items:center; gap:10px; height:56px; padding:0 12px 0 11px; background:var(--c); border-radius:10px 10px 10px 0; min-width:210px; }
.rep>.rtop::after{ content:""; position:absolute; bottom:-8px; left:40px; width:32px; height:8px; background:var(--c); clip-path:polygon(0 0,100% 0,76% 100%,24% 100%); z-index:2; }
.rep>.mouth{ display:flex; }
.rep .arm{ width:22px; background:var(--c); flex:none; }
.rep .slot{ min-width:158px; min-height:52px; }
.rep .slot .ph{ width:150px; height:44px; margin:5px 0 5px 4px; border:2.5px dashed rgba(217,120,15,.55); border-radius:10px; background:rgba(255,154,46,.08); }
.rep>.rbot{ position:relative; height:26px; background:var(--c); border-radius:0 10px 10px 10px; box-shadow:inset 0 -5px 0 var(--cd); }
.nctl{ display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.22); border-radius:999px; padding:3px; }
.nctl button{ width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.18); color:#fff; font-weight:700; font-size:20px; line-height:1; }
.nctl button:hover{ background:rgba(0,0,0,.3); }
.nctl b{ min-width:38px; height:32px; padding:0 6px; border-radius:999px; background:#fff; color:var(--ink); display:grid; place-items:center; font-size:19px; }
.lap{ display:none; background:#fff; color:var(--ctl-d); border-radius:999px; padding:2px 10px; font-size:16px; font-weight:700; box-shadow:0 0 0 3px var(--glow); }
.rep.running>.rtop .lap{ display:inline-block; }
.rep.running>.rtop{ box-shadow:0 0 0 3px #fff,0 0 18px var(--glow); }
.blk.on{ box-shadow:inset 0 -5px 0 var(--cd),0 0 0 3px #fff,0 0 0 6px var(--glow),0 0 22px var(--glow); filter:brightness(1.08); animation:onpop .3s; }
@keyframes onpop{ 50%{ transform:scale(1.05); } }
.blk.err{ box-shadow:inset 0 -5px 0 var(--cd),0 0 0 3px #fff,0 0 0 7px var(--red); animation:shake .4s 2; }
.blk.fresh{ animation:snapin .45s cubic-bezier(.3,1.8,.5,1); }
@keyframes snapin{ 0%{ transform:scale(.7) rotate(-4deg); } 60%{ transform:scale(1.08) rotate(1deg); } }
.ghost{ position:fixed; left:0; top:0; z-index:100; pointer-events:none; opacity:.93; filter:drop-shadow(0 10px 14px rgba(13,48,73,.28)); --hole:transparent; }
.ghost>.blk{ transform:rotate(-3deg) scale(1.04); }
body.dragging, body.dragging *{ cursor:grabbing !important; }
body.busy .pal{ opacity:.5; pointer-events:none; }
body.busy .canvas .blk{ cursor:default; }

/* escenario */
.stage{ display:flex; flex-direction:column; gap:12px; padding:14px; overflow:auto; }
.ctrls{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.cbtn{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--muted); }
.cbtn .cc{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:#fff; border:2px solid var(--line); box-shadow:0 5px 0 var(--line2); transition:transform .08s,box-shadow .08s; }
.cbtn:active .cc{ transform:translateY(4px); box-shadow:0 1px 0 var(--line2); }
.cbtn .cc svg{ width:30px; height:30px; }
.cbtn.go .cc{ background:var(--ok); border-color:var(--ok); box-shadow:0 5px 0 var(--ok-d); }
.cbtn.go:active .cc{ box-shadow:0 1px 0 var(--ok-d); }
.cbtn.go.ready .cc{ animation:ready 1.5s ease-out infinite; }
@keyframes ready{ 0%{ box-shadow:0 5px 0 var(--ok-d),0 0 0 0 rgba(30,196,140,.65); } 100%{ box-shadow:0 5px 0 var(--ok-d),0 0 0 18px rgba(30,196,140,0); } }
.cbtn[disabled]{ opacity:.4; cursor:default; }
.speed{ margin-left:auto; display:flex; align-items:center; gap:6px; align-self:center; font-size:20px; }
.speed input{ accent-color:var(--cel); width:96px; }
.boardwrap{ display:flex; justify-content:center; }
.board{ background:#fff; border:2px solid #C9E9FB; border-radius:22px; padding:10px; box-shadow:0 0 0 6px rgba(87,225,255,.14),0 12px 28px rgba(22,137,201,.14); }
.board.bump{ animation:boardshake .45s; }
@keyframes boardshake{ 20%{ transform:translateX(-9px) rotate(-1deg); } 40%{ transform:translateX(8px) rotate(1deg); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(3px); } }
.board.win{ animation:boardwin 1.2s ease-in-out 2; }
@keyframes boardwin{ 50%{ box-shadow:0 0 0 8px var(--star),0 0 40px var(--star); } }
.cells{ position:relative; display:grid; gap:3px; background:#D2ECFA; padding:3px; border-radius:14px; }
.cell{ width:var(--cs); height:var(--cs); background:#F8FDFF; border-radius:7px; position:relative; display:grid; place-items:center; }
.cell.alt{ background:#EBF7FF; }
.cells.intro .cell{ animation:cellIn .45s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay:calc(var(--i)*45ms); }
@keyframes cellIn{ from{ transform:scale(0) rotate(-20deg); opacity:0; } }
.cell>svg{ width:88%; height:88%; overflow:visible; }
.cell .goal{ animation:goalspin 2.6s ease-in-out infinite; }
@keyframes goalspin{ 0%,100%{ transform:scale(1) rotate(0); } 50%{ transform:scale(1.12) rotate(14deg); } }
.cell .bat{ animation:batbob 1.5s ease-in-out infinite; }
@keyframes batbob{ 50%{ transform:translateY(-7%); filter:drop-shadow(0 0 6px #1EC48C); } }
.cell.trail::after{ content:""; position:absolute; width:22%; height:22%; border-radius:50%; background:var(--tc,var(--glow)); box-shadow:0 0 10px var(--tc,var(--glow)); opacity:.9; animation:dotIn .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes dotIn{ from{ transform:scale(0); } 60%{ transform:scale(1.8); } }
.cell.flash{ animation:flash .5s 2; }
@keyframes flash{ 50%{ box-shadow:inset 0 0 0 4px var(--red); background:#FFE3E5; } }
.cell.got .bat{ opacity:.18; transition:opacity .4s; animation:none; }
/* pintar: celdas rojas (hay que pintarlas), verdes (hay que bailar) y pintadas de azul */
.cell.red{ background:#FFC2C6; box-shadow:inset 0 0 0 3px #FF5A62; }
.cell.green{ background:#C4F3E0; box-shadow:inset 0 0 0 3px #1EC48C; }
.cell.pnt{ background:var(--paint); box-shadow:inset 0 0 0 3px #2563C9; animation:paintIn .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes paintIn{ from{ background:#fff; transform:scale(.8); } }
.cell.danced{ box-shadow:inset 0 0 0 3px #1EC48C,0 0 0 3px var(--star),0 0 16px var(--star); }
.robot.boogie .bob{ animation:dance .6s ease-in-out 1; }
/* pincel en uso: se ve un pincel sobre el robot */
.robot .penmark{ position:absolute; right:-6%; bottom:4%; width:42%; height:42%; border-radius:50%; background:var(--pnt); border:2.5px solid #fff; box-shadow:0 2px 6px rgba(13,48,73,.3); display:grid; place-items:center; transform:scale(0); transition:transform .25s cubic-bezier(.3,1.8,.5,1); z-index:2; }
.robot .penmark svg{ width:62%; height:62%; }
.robot.pen .penmark{ transform:scale(1); }
.act.off{ --c:#8E6AAE; --cd:#6C4D88; }
.chip.pench{ color:#7E3DB0; }
.chip.pench svg{ width:22px; height:22px; }
.chip.pench.on{ background:var(--pnt); border-color:var(--pnt-d); color:#fff; }
.chip .sq{ width:20px; height:20px; border-radius:5px; flex:none; }
.cell.hint::before{ content:""; position:absolute; inset:16%; border-radius:50%; border:4px solid var(--star); box-shadow:0 0 14px var(--star); animation:pulse 1.1s ease-in-out infinite; animation-delay:var(--hd,0s); opacity:0; z-index:2; }
@keyframes pulse{ 0%{ opacity:0; transform:scale(.6); } 40%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(1.15); } }
.robot{ position:absolute; top:3px; left:3px; width:var(--cs); height:var(--cs); pointer-events:none; transition:transform var(--t) cubic-bezier(.45,.05,.3,1); z-index:3; }
.robot.noanim{ transition:none; }
.robot .shadow{ position:absolute; left:24%; right:24%; bottom:2%; height:9%; border-radius:50%; background:rgba(13,48,73,.18); }
.robot .bob{ position:absolute; inset:0; animation:float 2.2s ease-in-out infinite; }
.robot.drop .bob{ animation:dropIn .7s cubic-bezier(.3,1.5,.5,1) .35s backwards; }
@keyframes dropIn{ from{ transform:translateY(-160%) scale(.6); opacity:0; } }
.robot svg, .cell .rsvg{ width:100%; height:100%; display:block; overflow:visible; }
.pupils{ transition:transform .2s; }
[data-look="u"] .pupils{ transform:translate(0,-3px); } [data-look="d"] .pupils{ transform:translate(0,3px); }
[data-look="l"] .pupils{ transform:translate(-4px,0); } [data-look="r"] .pupils{ transform:translate(4px,0); }
.flame{ opacity:0; transition:opacity .15s; }
.robot.moving .flame{ opacity:1; animation:flick .12s infinite alternate; }
.robot.moving .bob{ animation:squish var(--t) ease-in-out; }
@keyframes squish{ 30%{ transform:scale(1.08,.92) translateY(4%); } 70%{ transform:scale(.95,1.06) translateY(-6%); } }
.robot.shake .bob{ animation:shake .35s; }
.robot.happy .bob{ animation:dance .7s ease-in-out 3; }
@keyframes dance{ 25%{ transform:translateY(-26%) rotate(-14deg); } 50%{ transform:translateY(0) rotate(0); } 75%{ transform:translateY(-26%) rotate(14deg); } }
@keyframes float{ 0%,100%{ transform:translateY(-2%); } 50%{ transform:translateY(3%); } }
@keyframes flick{ to{ opacity:.55; } }
@keyframes shake{ 25%{ transform:translateX(-5px) rotate(-5deg); } 75%{ transform:translateX(5px) rotate(5deg); } }
@keyframes pop{ 0%{ transform:scale(.94); } 60%{ transform:scale(1.03); } }
.status{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.status:empty{ display:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:4px 14px 4px 8px; font-weight:700; font-size:17px; }
.chip svg{ width:28px; height:28px; }
.chip .bslot{ display:inline-flex; opacity:.3; transition:opacity .3s; }
.chip .bslot.on{ opacity:1; }
.chip.full{ background:#DFF8EE; border-color:var(--ok); }
.chip.bump{ animation:bump .4s; }
.msg{ display:flex; align-items:center; gap:14px; background:#fff; border:2px solid var(--line); border-radius:20px; padding:12px 16px; min-height:86px; }
.msg .mi{ width:60px; height:60px; flex:none; display:grid; place-items:center; border-radius:16px; background:var(--bg2); }
.msg .mi svg{ width:46px; height:46px; overflow:visible; }
.msg .mt{ font-size:22px; font-weight:700; line-height:1.2; }
.msg .ms{ font-size:16px; color:var(--muted); font-weight:500; margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.msg .ms svg{ width:24px; height:24px; }
.msg .bigstars{ display:flex; gap:4px; margin-top:6px; }
.msg .bigstars svg{ width:38px; height:38px; animation:starIn .55s cubic-bezier(.3,1.8,.5,1) backwards; }
.msg .bigstars svg:nth-child(2){ animation-delay:.15s; } .msg .bigstars svg:nth-child(3){ animation-delay:.3s; }
@keyframes starIn{ from{ transform:scale(0) rotate(-120deg); } }
.msg .unl{ margin-top:8px; display:inline-flex; align-items:center; gap:6px; background:#FFF6D6; border:1.5px solid var(--star); border-radius:12px; padding:4px 12px; font-weight:700; font-size:16px; animation:bump .8s ease-in-out 3; }
.msg .unl svg{ width:22px; height:22px; }
.nextbtn{ margin-top:8px; margin-left:8px; display:inline-flex; align-items:center; gap:6px; padding:8px 14px 8px 18px; border-radius:14px; background:var(--ok); color:#fff; font-weight:700; font-size:17px; box-shadow:0 4px 0 var(--ok-d); animation:nudge 1.2s ease-in-out infinite; }
.nextbtn svg{ width:22px; height:22px; }
.nextbtn:active{ transform:translateY(3px); box-shadow:none; }
@keyframes nudge{ 50%{ transform:translateX(5px); } }
.msg.ok{ border-color:var(--ok); background:#F0FCF7; } .msg.err{ border-color:var(--red); background:#FFF4F5; } .msg.warn{ border-color:var(--ctl); background:#FFF8EF; }
.msg.pop{ animation:pop .35s; }
.msg.ok .mi{ background:#FFF6D6; animation:spinstar 1s ease-out; }
@keyframes spinstar{ from{ transform:rotate(-200deg) scale(.3); } }

/* efectos flotantes */
.floater{ position:fixed; z-index:160; pointer-events:none; font-weight:800; font-size:28px; color:var(--fc); text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 4px 10px rgba(13,48,73,.25); animation:floatUp 1s ease-out forwards; }
@keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,-30%) scale(.5); } 20%{ opacity:1; transform:translate(-50%,-70%) scale(1.2); } 100%{ opacity:0; transform:translate(-50%,-190%) scale(1); } }
.flystar{ position:fixed; left:0; top:0; z-index:170; width:44px; height:44px; pointer-events:none; filter:drop-shadow(0 0 8px rgba(255,194,26,.8)); }
.flystar svg{ width:100%; height:100%; }

/* ---------- editor ---------- */
.edit{ max-width:1160px; margin:0 auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,380px); gap:20px; align-items:start; }
@media (max-width:860px){ .edit{ grid-template-columns:1fr; } }
.edit .side{ padding:18px; display:flex; flex-direction:column; gap:16px; }
.edit .side h3{ font-size:18px; }
.tools{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tool{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:14px; background:var(--bg2); border:2px solid var(--line); font-weight:600; font-size:16px; }
.tool svg{ width:36px; height:36px; flex:none; overflow:visible; }
.tool[aria-pressed="true"]{ border-color:var(--cel); background:#E2F5FF; box-shadow:0 0 0 3px var(--cel-l); }
.editing .cell{ cursor:pointer; }
.editing .cell:hover{ box-shadow:inset 0 0 0 3px var(--cel); }
.seg{ display:inline-flex; background:var(--bg2); border:1.5px solid var(--line); border-radius:14px; padding:4px; gap:4px; }
.seg button{ padding:8px 14px; border-radius:10px; font-weight:600; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--cel); color:#fff; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bigbtn{ display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:16px; font-weight:700; font-size:18px; background:var(--ok); color:#fff; box-shadow:0 5px 0 var(--ok-d); }
.bigbtn svg{ width:24px; height:24px; }
.bigbtn.alt{ background:#fff; color:var(--ink); border:2px solid var(--line); box-shadow:0 5px 0 var(--line2); }
.bigbtn:active{ transform:translateY(4px); box-shadow:none; }

/* ---------- taller del robot ---------- */
.shop{ max-width:1100px; margin:0 auto; padding:22px; display:grid; grid-template-columns:minmax(260px,360px) minmax(0,1fr); gap:20px; align-items:start; }
@media (max-width:820px){ .shop{ grid-template-columns:1fr; } }
.stagebox{ padding:22px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; position:sticky; top:82px; overflow:hidden; }
@media (max-width:820px){ .stagebox{ position:static; } }
.stagebox h2{ font-size:28px; }
.stagebox p{ margin:0; color:var(--muted); font-size:17px; display:flex; align-items:center; gap:6px; }
.stagebox p svg{ width:26px; height:26px; }
.pedestal{ position:relative; width:250px; height:250px; display:grid; place-items:center; }
.pedestal::before{ content:""; position:absolute; inset:0; border-radius:50%; background:repeating-conic-gradient(rgba(255,194,26,.28) 0 12deg,rgba(87,225,255,.18) 12deg 24deg); -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%); mask:radial-gradient(circle,#000 30%,transparent 70%); animation:spin 14s linear infinite; }
.pedestal::after{ content:""; position:absolute; bottom:22px; width:150px; height:26px; border-radius:50%; background:radial-gradient(rgba(13,48,73,.22),transparent 70%); }
.pedestal svg{ width:175px; height:175px; position:relative; z-index:1; overflow:visible; animation:float 2.6s ease-in-out infinite; }
.pedestal.cheer svg{ animation:dance .7s ease-in-out 2; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.shopside{ padding:20px; display:flex; flex-direction:column; gap:14px; }
.shopside h3{ font-size:20px; }
.shopside .tip{ margin:0; color:var(--muted); font-size:15px; }
.skins{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.skin{ position:relative; background:#fff; border:2.5px solid var(--line); border-radius:22px; padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .15s; font-size:17px; }
.skins.intro .skin{ animation:cardIn .5s cubic-bezier(.3,1.6,.5,1) backwards; animation-delay:calc(var(--i)*70ms); }
.skin:hover{ transform:translateY(-5px) rotate(1.5deg); border-color:var(--cel); }
.skin .prev{ width:92px; height:92px; overflow:visible; }
.skin.on{ border-color:var(--ok); box-shadow:0 0 0 4px #CFF5E6; }
.skin.poor .prev{ filter:grayscale(.6); opacity:.75; }
.skin .tag{ display:inline-flex; align-items:center; gap:4px; padding:5px 14px; border-radius:999px; font-weight:700; font-size:16px; background:var(--bg2); border:1.5px solid var(--line); }
.skin .tag svg{ width:22px; height:22px; }
.skin .tag.buy{ background:linear-gradient(135deg,#FFC21A,#FF9A2E); color:#fff; border-color:transparent; }
.skin .tag.ask{ background:var(--red); color:#fff; border-color:transparent; animation:bump .5s ease-in-out infinite; }
.skin .tag.use{ background:var(--ok); color:#fff; border-color:transparent; }
.swatches{ display:flex; gap:12px; flex-wrap:wrap; }
.sw{ width:54px; height:54px; border-radius:50%; background:var(--c); border:4px solid #fff; box-shadow:0 0 0 2px var(--line2),0 4px 0 rgba(13,48,73,.12); transition:transform .2s cubic-bezier(.3,1.6,.5,1); }
.sw:hover{ transform:scale(1.12) rotate(-8deg); }
.sw[aria-pressed="true"]{ box-shadow:0 0 0 3px var(--ink),0 4px 0 rgba(13,48,73,.12); transform:scale(1.14); }

.testbox{ position:fixed; right:16px; bottom:16px; z-index:200; background:#fff; border:2px solid var(--cel); border-radius:16px; padding:14px 18px; font-size:14px; max-width:520px; max-height:70vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.2); }
.testbox h3{ margin-bottom:8px; }
canvas#conf{ position:fixed; inset:0; pointer-events:none; z-index:150; width:100%; height:100%; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; animation-delay:0s !important; }
  .robot{ transition:none; } .sky{ display:none; }
}
</style>
</head>
<body>
<canvas id="conf"></canvas>
<div class="sky" id="sky" aria-hidden="true"></div>

<header class="top">
  <button class="tbtn hidden" id="backBtn"></button>
  <div class="logo" id="logo"><svg viewBox="-50 -50 100 100" id="logoBot" data-look="r" aria-hidden="true"></svg><span>Programación por bloques</span></div>

      <h1 id="heroTitle" aria-label="Programación por bloques"></h1>

      <div class="herobtns"><button class="shopbtn" id="shopBtn"></button><span class="total" id="total"></span><button class="resetbtn" id="resetBtn" title="Para cuando juega un alumno nuevo"></button></div>
    </div>
  </section>
  <div id="parts"></div>
  <div class="sec"><span class="sico" style="background:#DDF6FF" id="ico3"></span><h2>Mapa propio</h2><span class="sub">inventá un mapa y jugalo</span></div>
  <div class="cards" id="cards3"></div>
</main>

<!-- JUEGO -->
<main class="ide hidden" id="game">
  <nav class="panel cats" id="cats" aria-label="Categorías"></nav>
  <aside class="panel pal" id="pal" aria-label="Bloques"></aside>
  <section class="panel script" id="script" aria-label="Programa">

      <label class="speed" title="Velocidad"><span aria-hidden="true">🐢</span><input type="range" id="speed" min="250" max="1050" step="50" value="650" aria-label="Velocidad"><span aria-hidden="true">🐇</span></label>
    </div>

</main>

<!-- EDITOR -->
<main class="edit hidden" id="editor">
  <div class="boardwrap" id="eWrap"><div class="board editing" id="eBoard"></div></div>
  <div class="panel side">
    <h3>Herramientas</h3>
    <div class="tools" id="tools"></div>
    <div class="row"><b>Tamaño</b><div class="seg" id="sizeSeg"><button data-s="5">5×5</button><button data-s="6">6×6</button><button data-s="7">7×7</button></div></div>
    <div class="row"><button class="bigbtn" id="edPlay"></button><button class="bigbtn alt" id="edClear">Vaciar</button></div>
    <div class="msg" id="edMsg"></div>
  </div>
</main>

<!-- TALLER -->
<main class="shop hidden" id="shop">
  <div class="panel stagebox">
    <div class="pedestal" id="ped"></div>
    <h2 id="shopName"></h2>
    <p id="shopStars"></p>
  </div>
  <div class="panel shopside">
    <h3>Diseños</h3>
    <div class="skins" id="skins"></div>
    <p class="tip">Tocá un diseño para comprarlo con estrellas (tocá dos veces para confirmar).</p>
    <h3>Colores</h3>
    <div class="swatches" id="swatches"></div>
  </div>
</main>

<script>
/*PURE-START*/
/* ================= misiones =================
   . piso  # caja  R robot  E estrella  B batería  X celda roja (hay que pintarla)  V celda verde (hay que bailar)
   sol: solución de referencia: r l u d flechas, n usar pincel, f guardar pincel, p pintar (sello, parte Si), b bailar,
        "4(r u)" = repetir 4 [derecha arriba], "?x(p)" = si la celda es roja [pintar], "?v(b)" = si es verde [bailar]
   max: bloques permitidos (reglas de Repetir), contando el bloque «al tocar»
   need: llegar pintando, hay que llegar a la estrella con al menos «need» celdas pintadas (cualquiera)
   pincel: mientras está en uso, el robot pinta la celda donde está y cada celda que pisa (la estrella no se pinta) */
/* partes = cards del menú. after: partes que hay que terminar para abrirla */
const PARTS=[
 {id:1,title:"Secuencia",sub:"un bloque después del otro",c:"#3B82F0",l:"#DCE9FF",after:[]},
 {id:2,title:"Pintar",sub:"usar el pincel y guardarlo",c:"#A35BD6",l:"#F0E1FF",after:[1]},
 {id:3,title:"Repetir",sub:"el bloque que repite",c:"#FF9A2E",l:"#FFE2C2",after:[1]},
 {id:4,title:"Si",sub:"el robot mira la celda y decide",c:"#14B8A6",l:"#CCF5EF",after:[2,3]}
];
/* cls: reglas (1 = meta de bloques, 2 = máximo de bloques).
   tools: bloques extra (r repetir, n pincel, p pintar de un toque, b bailar, i si).
   strict: pintar o bailar en la celda equivocada es error. need: estrellas de la parte para abrir el grupo */
const GROUPS=[
 {id:"A",part:1,cls:1,tools:"",title:"Primeros pasos",sub:"sin baterías",need:0,c:"#3B82F0",l:"#DCE9FF"},
 {id:"B",part:1,cls:1,tools:"",title:"Con batería",sub:"primero la batería, después la estrella",need:8,c:"#1EC48C",l:"#D2F6E8"},
 {id:"C",part:1,cls:1,tools:"",title:"Dos baterías",sub:"juntá las dos",need:16,c:"#8B6CF0",l:"#E6DFFF"},
 {id:"G",part:2,cls:1,tools:"n",title:"Llegar pintando",sub:"el pincel pinta todo por donde pasa",need:0,c:"#A35BD6",l:"#F0E1FF"},
 {id:"H",part:2,cls:1,tools:"n",title:"Solo las rojas",sub:"guardá el pincel en las blancas",need:6,c:"#FF4F7A",l:"#FFDCE5"},
 {id:"D",part:3,cls:2,tools:"r",title:"Repetir",sub:"pocos bloques, muchos pasos",need:0,c:"#FF9A2E",l:"#FFE2C2"},
 {id:"E",part:3,cls:2,tools:"r",title:"Repetir con batería",sub:"repetir y juntar",need:8,c:"#FF6FB5",l:"#FFDCEC"},
 {id:"F",part:3,cls:2,tools:"r",title:"Repetir con 2 baterías",sub:"el gran desafío",need:14,c:"#E64C55",l:"#FFD9DB"},
 {id:"J",part:4,cls:2,tools:"rpi",strict:true,title:"Si es roja",sub:"pintá solo las rojas",need:0,c:"#14B8A6",l:"#CCF5EF"},
 {id:"K",part:4,cls:2,tools:"rpbi",strict:true,title:"Rojo y verde",sub:"rojas: pintar · verdes: bailar",need:6,c:"#0EA5E9",l:"#D3F0FC"}
];
const MISSIONS=[
 {id:"a1",grp:"A",title:"Primer paseo",rows:[".....","..#..","R....","..E..","....."],sol:"r r d"},
 {id:"a2",grp:"A",title:"La esquina",rows:[".....","#....",".##E.",".##..","R...."],sol:"r r r u u"},
 {id:"a3",grp:"A",title:"Esquivar las cajas",rows:["#...#","..#..","R.#.E","..#..","#...#"],sol:"u r u r r d d r"},
 {id:"a4",grp:"A",title:"Zigzag",rows:["R.#..","#..#.",".#..#","..#..","...#E"],sol:"r d r d r d r d"},
 {id:"b1",grp:"B",title:"Primero la batería",rows:["..B..","##.##","R...E",".#.#.","....."],sol:"r r u u d d r r"},
 {id:"b2",grp:"B",title:"La batería de arriba",rows:[".B.#.",".#...","R..#E","..#..","#...."],sol:"u u r r d r r d"},
 {id:"b3",grp:"B",title:"La batería del medio",rows:["E.#..",".#..#","..B..","#..#.","R.#.."],sol:"r u u r l l u u"},
 {id:"b4",grp:"B",title:"El laberinto",rows:[".#...","B..#E","#.#..","..#.#","R...."],sol:"u r u u l r r u r r d"},
 {id:"c1",grp:"C",title:"Abajo y arriba",rows:["..#.B",".#...","R..#E","...#.","B#..."],sol:"d d u u r r u r u r d d"},
 {id:"c2",grp:"C",title:"El gran recorrido",rows:["B.#...","..#.#.","R...#E","..#...","#...#B"],sol:"u u d r d r r d r r d u u"},
 {id:"g1",grp:"G",title:"Primer pincelazo",need:3,rows:["..#..","R...E","..#.."],sol:"n r r r r"},
 {id:"g2",grp:"G",title:"Caminito pintado",need:5,rows:[".#...","R..#.","#...E"],sol:"n r r d r r"},
 {id:"g3",grp:"G",title:"Pintar y juntar",need:6,rows:["..B..","R.#.E","....."],sol:"n u r r r d r"},
 {id:"h1",grp:"H",title:"Tres rojas",rows:["..#..","RXXXE","..#.."],sol:"r n r r r"},
 {id:"h2",grp:"H",title:"Rojas y blancas",rows:["#.#.#..","RXX.XXE","#...#.."],sol:"r n r f r r n r r"},
 {id:"h3",grp:"H",title:"Bajar pintando",rows:["R.#..","X.#..","X..XE","#.#.."],sol:"d n d f r r r n r"},
 {id:"h4",grp:"H",title:"Rojas y batería",rows:[".B#..","X..#E","R.#X.","....."],sol:"u n f u r d d d r r u n f r u"},
 {id:"h5",grp:"H",title:"La gran mancha",rows:["..#...","XX..#.","..#XX.","R..#.X","#....X","...#.E"],sol:"u u n r f r r d n r f d r n d d"},
 {id:"d1",grp:"D",title:"El pasillo largo",max:3,rows:["..#...#","#######","R.....E","#######","#...#.."],sol:"6(r)"},
 {id:"d2",grp:"D",title:"La vuelta grande",max:5,rows:["R......",".#####.",".#...#.",".#.#.#.",".#...#.",".#####.","......E"],sol:"6(r) 6(d)"},
 {id:"d3",grp:"D",title:"La escalera",max:4,rows:["...#E","..#..",".#..#","#..#.","R.#.."],sol:"4(r u)"},
 {id:"d4",grp:"D",title:"Pasillo y escalera",max:6,rows:[".....#E","....#..","####..#","R....#."],sol:"3(r) 3(r u)"},
 {id:"e1",grp:"E",title:"Ida y vuelta",max:7,rows:["R.....B",".######",".#.....",".#.##..","E#....."],sol:"6(r) 6(l) 4(d)"},
 {id:"e2",grp:"E",title:"Escalera a la batería",max:6,rows:["##.#...","#..B..E","##..#.#","#..#..#","R.#...."],sol:"3(r u) 3(r)"},
 {id:"e3",grp:"E",title:"La montaña",max:7,rows:["R.####E","#..#...","##.....","###B.##"],sol:"3(r d) 3(r u)"},
 {id:"f1",grp:"F",title:"Dos puntas",max:7,rows:["B..R..B","######.","######.","#.....E"],sol:"3(l) 6(r) 3(d)"},
 {id:"f2",grp:"F",title:"Repetir adentro",max:6,rows:["R..B...","#.#.###","#...#..","##....B","#..###.","#..#...","#.....E"],sol:"2(3(r) 3(d))"},
 {id:"j1",grp:"J",title:"Solo las rojas",max:5,rows:["#.##.#.#","RX.XX.XE","#.#..#.#"],sol:"7(r ?x(p))"},
 {id:"j2",grp:"J",title:"Escalera roja",max:7,rows:["####XE","###X.#","##..##","#X.###","R.####"],sol:"4(r u ?x(p)) r"},
 {id:"j3",grp:"J",title:"Bajar y doblar",max:9,rows:["R#....","X#.#..","X#...#",".#.#..","X#....","..XX.E"],sol:"5(d ?x(p)) 5(r ?x(p))"},
 {id:"k1",grp:"K",title:"A bailar",max:5,rows:["##.#.##","R.VV.VE","#.##..#"],sol:"6(r ?v(b))"},
 {id:"k2",grp:"K",title:"Rojo y verde",max:7,rows:["#.#..#.#","RXV.XXVE","#..#.#.."],sol:"7(r ?x(p) ?v(b))"},
 {id:"k3",grp:"K",title:"Escalera de colores",max:8,rows:["R.####","#X.###","##V.##","###..#","####X.","#####E"],sol:"5(r d ?x(p) ?v(b))"}
].map(m=>{ const g=GROUPS.find(x=>x.id===m.grp); return Object.assign(m,{cls:g.cls,part:g.part,tools:g.tools,strict:!!g.strict}); });
PARTS.forEach(p=>MISSIONS.filter(m=>m.part===p.id).forEach((m,i)=>m.num=i+1)); /* numeración dentro de cada parte */
/* desafíos extra: 3 niveles seguidos con cronómetro (no hay límite de tiempo, solo se mide).
   Estrellas por el tiempo total: hasta t3 segundos = 3, hasta t2 = 2, más = 1.
   El reloj se pausa entre nivel y nivel. Se abre al terminar todos los niveles de la parte. */
const CHALLENGES=[
 {id:"x1",part:1,cls:1,tools:"",title:"Desafío de secuencia",t3:150,t2:240,levels:[
   {title:"Calentando motores",rows:["R..#..","##.#.#","#.....","#.##..","#...#E"],sol:"r r d d r r d r d"},
   {title:"La batería escondida",rows:["...#.E",".#.#..",".#B.#.","R..#..","##...#","......"],sol:"r r u d d r r u r u u u"},
   {title:"Dos baterías",rows:["..#..B",".B..#.","#.#...","R..#.#","#.#...","...#.E"],sol:"r u u r r u r r d d l d d r d"}]},
 {id:"x4",part:2,cls:1,tools:"n",title:"Desafío de pintar",t3:150,t2:240,levels:[
   {title:"Rojas en fila",rows:["R.XX.","#.#X.","XX...","E...."],sol:"r r n r d f d l l n l d"},
   {title:"Rojas y estrella",rows:["..X#E","XX#..","R..XX","##..."],sol:"u n r f u r n f l d d r r n r f u u"},
   {title:"La gran pintada",rows:["..#.B","XXX..","R.#.#","#....","EXX.."],sol:"u n r r f r u r d l d d d l n l l"}]},
 {id:"x2",part:3,cls:2,tools:"r",title:"Desafío de repetir",t3:150,t2:240,levels:[
   {title:"Escalones dobles",max:5,rows:["R..####","##...##","####...","######E"],sol:"3(r r d)"},
   {title:"Subir y bajar",max:7,rows:["####B.###","###....##","##..##..#","#..####..","R.######E"],sol:"4(r u) 4(r d)"},
   {title:"La gran escalera",max:6,rows:["R..#...","##B#.#.","#....##","#.##.#.","#..#B..","#.###..","...#..E"],sol:"3(2(r) 2(d))"}]},
 {id:"x5",part:4,cls:2,tools:"rpbi",strict:true,title:"Desafío del si",t3:150,t2:240,levels:[
   {title:"Pasillo de colores",max:7,rows:["#.#..#.#.#","RXV.XX.VXE","#..#.#..#."],sol:"9(r ?x(p) ?v(b))"},
   {title:"Escalera de colores",max:8,rows:["####E","###X.","##X.#","#V.##","R.###"],sol:"4(r u ?x(p) ?v(b))"},
   {title:"Dos pasillos",max:10,rows:["RX.VX####","####.####","####.V.XX","########.","########E"],sol:"2(4(r ?x(p) ?v(b)) 2(d))"}]}
];
CHALLENGES.forEach(ch=>ch.levels.forEach((m,i)=>Object.assign(m,{id:ch.id+"-"+(i+1),num:i+1,cls:ch.cls,part:ch.part,tools:ch.tools,strict:!!ch.strict,ch:ch.id})));
function timeStars(ch,sec){ return sec<=ch.t3?3:sec<=ch.t2?2:1; }
function fmtTime(sec){ sec=Math.floor(sec); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
const DIRS={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]};
const MAXSTEPS=400, MAXB=30;

function find(rows,ch){ for(let r=0;r<rows.length;r++){ const c=rows[r].indexOf(ch); if(c>=0) return [r,c]; } return null; }
function countB(rows){ return rows.join("").split("B").length-1; }
function cellsOf(rows,ch){ const out=[]; rows.forEach((row,r)=>[...row].forEach((x,c)=>{ if(x===ch) out.push(r+","+c); })); return out; }
function hasE(map){ return map.rows.some(r=>r.includes("E")); }
/* pnt: celdas pintadas, dan: verdes donde bailó, wrong: pintadas que no eran rojas, pen: pincel en uso */
function startState(map){ const R=find(map.rows,"R"); return {r:R[0],c:R[1],got:[],pnt:[],dan:[],wrong:0,pen:false,starNoBat:false}; }
/* bloques de acción y su letra en las soluciones */
const ACTS={paint:"p",dance:"b",penon:"n",penoff:"f"};
/* pinta la celda (r,c) si se puede (la estrella no se pinta). Pintar algo que no es rojo cuenta como «wrong», salvo en llegar pintando */
function paintCell(map,S,r,c){ const key=r+","+c, ch=map.rows[r][c];
  if(ch==="E"||S.pnt.includes(key)) return S;
  return {...S,pnt:S.pnt.concat(key),wrong:S.wrong+(ch!=="X"&&!map.need?1:0)}; }
/* lo que falta para ganar (baterías, rojas, verdes, celdas en pintar libre) */
function goalLeft(map,S){
  return {bat:countB(map.rows)-S.got.length, red:cellsOf(map.rows,"X").filter(k=>!S.pnt.includes(k)).length,
    green:cellsOf(map.rows,"V").filter(k=>!S.dan.includes(k)).length, need:map.need?Math.max(0,map.need-S.pnt.length):0}; }
function goalMet(map,S){ const g=goalLeft(map,S); return !g.bat&&!g.red&&!g.green&&!g.need; }

/* un movimiento: devuelve choque, ok o llegada (no modifica S) */
function tryMove(map,S,dir){
  const rows=map.rows, [dr,dc]=DIRS[dir], r=S.r+dr, c=S.c+dc;
  if(r<0||c<0||r>=rows.length||c>=rows[0].length) return {k:"crash",why:"out",r,c};
  const ch=rows[r][c]; if(ch==="#") return {k:"crash",why:"rock",r,c};
  const got=S.got.slice(), key=r+","+c; let bat=false;
  if(ch==="B"&&!got.includes(key)){ got.push(key); bat=true; }
  let S2={...S,r,c,got}; const n0=S2.pnt.length;
  if(S.pen) S2=paintCell(map,S2,r,c); /* con el pincel en uso pinta cada celda que pisa */
  const pnt=S2.pnt.length>n0;
  if(ch==="E"){ if(goalMet(map,S2)) return {k:"win",S:S2,bat,pnt}; S2.starNoBat=true; }
  return {k:"ok",S:S2,bat,pnt};
}
/* acciones en la celda del robot: n usar pincel (y pinta donde está), f guardar pincel,
   p pintar de un toque, b bailar. En niveles «strict» pintar/bailar en la celda equivocada es error */
function tryAct(map,S,a){
  if(a==="n"){ const S2={...paintCell(map,S,S.r,S.c),pen:true}; return {k:"ok",S:S2,ok:true,pnt:S2.pnt.length>S.pnt.length}; }
  if(a==="f") return {k:"ok",S:{...S,pen:false},ok:true};
  const key=S.r+","+S.c, ch=map.rows[S.r][S.c], S2={...S};
  if(a==="p"){ const ok=ch==="X"&&!S.pnt.includes(key);
    if(!ok&&map.strict) return {k:"bad",why:"p"};
    if(!S.pnt.includes(key)) S2.pnt=S.pnt.concat(key);
    if(!ok&&!map.need) S2.wrong=S.wrong+1;
    return {k:"ok",S:S2,ok}; }
  const ok=ch==="V"; if(!ok&&map.strict) return {k:"bad",why:"b"};
  if(ok&&!S.dan.includes(key)) S2.dan=S.dan.concat(key);
  return {k:"ok",S:S2,ok};
}
/* color de la celda del robot para el bloque si: "x" roja sin pintar, "v" verde */
function cellColor(map,S){ const ch=map.rows[S.r][S.c]; return ch==="X"&&!S.pnt.includes(S.r+","+S.c)?"x":ch==="V"?"v":""; }

/* camino más corto (cada acción = 1 bloque) desde S: junta baterías, pinta rojas, baila en verdes y llega a la estrella si hay.
   Con pincel (tools «n») busca usarlo y guardarlo sin pintar nunca una celda que no sea roja.
   Devuelve [[fila,col,acción],...] (acción: u d l r, n/f pincel, p pintar, b bailar) */
function shortest(map,S){
  const rows=map.rows, n=rows.length, m=rows[0].length, E=hasE(map), PEN=!!map.tools&&map.tools.includes("n");
  const bats=cellsOf(rows,"B"), tg=cellsOf(rows,"X").map(k=>[k,"p"]).concat(PEN?[]:cellsOf(rows,"V").map(k=>[k,"b"]));
  const fullB=(1<<bats.length)-1, fullT=(1<<tg.length)-1; let b0=0, t0=0;
  S.got.forEach(k=>{ const i=bats.indexOf(k); if(i>=0) b0|=1<<i; });
  tg.forEach(([k,a],i)=>{ if((a==="p"?S.pnt:S.dan).includes(k)) t0|=1<<i; });
  if(!E&&b0===fullB&&t0===fullT) return [];
  /* con pincel: pisar (r,c) pinta; devuelve el nuevo t o -1 si pintaría una celda que no es roja */
  const ink=(t,r,c)=>{ const k=r+","+c, ch=rows[r][c], i=tg.findIndex(([x])=>x===k);
    if(i>=0) return t|1<<i; return ch==="E"||S.pnt.includes(k)?t:-1; };
  const start={r:S.r,c:S.c,b:b0,t:t0,w:S.pen?1:0,prev:null}, seen=new Set([`${S.r},${S.c},${b0},${t0},${start.w}`]); let q=[start];
  while(q.length){ const nq=[];
    for(const s of q){ const next=[];
      for(const d of "udlr"){
        const r=s.r+DIRS[d][0], c=s.c+DIRS[d][1];
        if(r<0||c<0||r>=n||c>=m||rows[r][c]==="#") continue;
        const t=PEN&&s.w?ink(s.t,r,c):s.t; if(t<0) continue;
        const bi=bats.indexOf(r+","+c); next.push({r,c,b:bi>=0?s.b|1<<bi:s.b,t,w:s.w,a:d}); }
      if(PEN){ if(s.w) next.push({...s,w:0,a:"f"});
        else { const t=ink(s.t,s.r,s.c); if(t>=0) next.push({...s,t,w:1,a:"n"}); } }
      else { const ti=tg.findIndex(([k])=>k===s.r+","+s.c);
        if(ti>=0&&!(s.t>>ti&1)) next.push({r:s.r,c:s.c,b:s.b,t:s.t|1<<ti,w:0,a:tg[ti][1]}); }
      for(const x of next){ const node={...x,prev:s};
        if(x.b===fullB&&x.t===fullT&&(!E||(DIRS[x.a]&&rows[x.r][x.c]==="E"))){ const path=[]; for(let y=node;y.prev;y=y.prev) path.unshift([y.r,y.c,y.a]); return path; }
        const k=`${x.r},${x.c},${x.b},${x.t},${x.w}`; if(!seen.has(k)){ seen.add(k); nq.push(node); } } }
    q=nq; }
  return null;
}

/* recorre el programa: "loop" al empezar cada vuelta de un repetir, "if" al preguntar, y una acción por cada bloque.
   test(color) se consulta en el momento, así el si ve la celda donde está el robot */
function* walk(list,test,prefix=[]){
  for(let i=0;i<list.length;i++){ const b=list[i], addr=prefix.concat(i);
    if(b.t==="move") yield {t:"move",addr,dir:b.dir};
    else if(ACTS[b.t]) yield {t:b.t,addr};
    else if(b.t==="if"){ const ok=test(b.c); yield {t:"if",addr,ok}; if(ok) yield* walk(b.body,test,addr); }
    else for(let k=0;k<b.n;k++){ yield {t:"loop",addr,k,n:b.n}; yield* walk(b.body,test,addr); } }
}
function countBlocks(list){ return list.reduce((a,b)=>a+1+(b.body?countBlocks(b.body):0),0); }
function hasRepeat(list){ return list.some(b=>b.t==="repeat"); }
function hasIf(list){ return list.some(b=>b.t==="if"||(b.body&&hasIf(b.body))); }
/* opt y límites cuentan el bloque «al tocar» */
function optFor(map,path){ return map.cls===2?map.max:map.need?null:(path?path.length+1:null); }
function limitFor(map,opt){ return map.cls===2?map.max:map.cls===1&&opt!=null?opt+2:MAXB; }
function starsFor(map,count,usedRep,opt,hint,wrong){
  let k=map.cls===2?(usedRep?3:2):(opt==null||count<=opt?3:2);
  if(wrong) k=Math.min(k,2); if(hint) k--; return Math.max(1,k);
}
/* grupos: cada parte tiene su cadena. El primero se abre al terminar las partes «after»;
   los demás al terminar el grupo anterior y juntar las estrellas pedidas (de esa parte) */
function partDone(stars,p){ return MISSIONS.filter(m=>m.part===p).every(m=>stars[m.id]); }
function partName(p){ return `Parte ${p} · ${PARTS.find(x=>x.id===p).title}`; }
function groupState(stars){
  let prev=null;
  return GROUPS.map(g=>{
    if(prev&&prev.g.part!==g.part) prev=null;
    const ms=MISSIONS.filter(m=>m.grp===g.id), done=ms.filter(m=>stars[m.id]).length;
    const earned=MISSIONS.filter(m=>m.part===g.part).reduce((a,m)=>a+(stars[m.id]||0),0);
    let open, prevLeft=0, gate=null;
    if(!prev){ const miss=PARTS.find(p=>p.id===g.part).after.filter(p=>!partDone(stars,p)); open=!miss.length; if(!open) gate=miss.map(partName).join(" y "); }
    else { prevLeft=prev.ms.length-prev.done; open=prev.open&&prevLeft===0&&earned>=g.need; }
    return prev={g,ms,done,open,prevLeft,prevTitle:prev&&prev.g.title,gate,earned}; });
}
function parseSol(s){ let i=0;
  function list(){ const out=[];
    while(i<s.length){ const ch=s[i];
      if(ch===" "){ i++; continue; }
      if(ch===")"){ i++; return out; }
      if(/\d/.test(ch)){ let num=""; while(/\d/.test(s[i])) num+=s[i++]; i++; out.push({t:"repeat",n:+num,body:list()}); }
      else if(ch==="?"){ const c=s[i+1]; i+=3; out.push({t:"if",c,body:list()}); }
      else { const a=Object.keys(ACTS).find(k=>ACTS[k]===ch); out.push(a?{t:a}:{t:"move",dir:ch}); i++; } }
    return out; }
  return list(); }
function simulate(map,prog){ let S=startState(map), n=0;
  for(const ev of walk(prog,c=>cellColor(map,S)===c)){ if(++n>MAXSTEPS) return {k:"long"};
    if(ev.t==="move"){ const res=tryMove(map,S,ev.dir); if(res.k==="crash") return res; S=res.S; if(res.k==="win") return res; }
    else if(ACTS[ev.t]){ const res=tryAct(map,S,ACTS[ev.t]); if(res.k==="bad") return res; S=res.S; } }
  return !hasE(map)&&goalMet(map,S)?{k:"win",S}:{k:"end",S}; }
function maxRun(list){ const s=[...walk(list,()=>false)].filter(e=>e.t!=="loop"&&e.t!=="if").map(e=>e.t==="move"?e.dir:ACTS[e.t]).join(""); return s?Math.max(...s.match(/(.)\1*/g).map(x=>x.length)):0; }
/* el mismo programa sin los si (todo lo de adentro siempre): en los niveles de Si tiene que fallar */
function stripIf(list){ return list.flatMap(b=>b.t==="if"?stripIf(b.body):b.body?[{...b,body:stripIf(b.body)}]:[b]); }
function selfTest(){
  const res=[...MISSIONS,...CHALLENGES.flatMap(c=>c.levels)].map(m=>{ const sol=parseSol(m.sol), sim=simulate(m,sol), path=shortest(m,startState(m)), cnt=countBlocks(sol)+1, used=hasRepeat(sol);
    const opt=optFor(m,path), lim=limitFor(m,opt), run=maxRun(sol), cond=m.tools.includes("i");
    /* todos los niveles terminan en la estrella: se gana al llegar con todo hecho */
    let ok=hasE(m)&&sim.k==="win"&&!!path&&cnt<=lim&&starsFor(m,cnt,used,opt,false,sim.S&&sim.S.wrong)===3;
    if(m.cls===1) ok=ok&&!used&&(m.need||(cnt===opt&&run<=3)); else ok=ok&&used;
    if(cond) ok=ok&&hasIf(sol)&&simulate(m,stripIf(sol)).k!=="win";
    return {id:m.id,title:m.title,ok,info:`sim:${sim.k} bfs:${path?path.length:"-"} bloques:${cnt}/${lim}${m.cls===1&&!m.need?" seguidos:"+run:""}${cond?" sin si: "+simulate(m,stripIf(sol)).k:""}`}; });
  /* con 2 estrellas en todo lo anterior de la parte alcanza para abrir cada grupo */
  PARTS.forEach(p=>{ let before=0; GROUPS.filter(g=>g.part===p.id).forEach(g=>{ const ok=g.need<=before*2; res.push({id:g.id,title:"Grupo "+g.title,ok,info:`pide ${g.need}, máx ${before*3}`}); before+=MISSIONS.filter(m=>m.grp===g.id).length; }); });
  return res;
}

let AC=null;
function tone(f,d,type="sine",vol=.12,when=0){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);}catch(e){} }
const SND={ move:()=>tone(620,.08,"triangle"), crash:()=>{tone(140,.3,"sawtooth",.12);tone(90,.35,"sawtooth",.1,.05)},
  bat:()=>[660,880,1100,1320].forEach((f,i)=>tone(f,.12,"triangle",.1,i*.07)), add:()=>tone(820,.05,"sine",.08),
  pick:()=>tone(520,.05,"sine",.07), snap:()=>{tone(880,.05,"sine",.09);tone(1320,.06,"sine",.06,.04)}, trash:()=>tone(200,.15,"triangle",.1),
  loop:()=>tone(980,.05,"sine",.05),
  paint:()=>{tone(400,.12,"triangle",.09);tone(700,.1,"sine",.07,.06)},
  dance:()=>[784,988,784,1175].forEach((f,i)=>tone(f,.1,"square",.05,i*.1)), nope:()=>{tone(300,.1,"triangle",.1);tone(240,.14,"triangle",.1,.09)},
  unlock:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,"triangle",.11,i*.09)),

const FX={P:[],on:false};
function fx(list){ if(RM.matches) return; FX.P.push(...list);
  if(!FX.on){ FX.on=true; requestAnimationFrame(fxLoop); } }
function fxLoop(){
  const cv=$("conf"), ctx=cv.getContext("2d");
  if(cv.width!==innerWidth||cv.height!==innerHeight){ cv.width=innerWidth; cv.height=innerHeight; }
  ctx.clearRect(0,0,cv.width,cv.height); FX.P=FX.P.filter(p=>p.life>0);
  for(const p of FX.P){ p.vy+=p.g; p.vx*=p.dr; p.vy*=p.dr; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life--;
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life/20); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
    if(p.sh==="star"){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?p.s*.22:p.s*.5; ctx.lineTo(r*Math.cos(a),r*Math.sin(a)); } ctx.fill(); }
    else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    ctx.restore(); }
  if(FX.P.length) requestAnimationFrame(fxLoop); else { FX.on=false; ctx.clearRect(0,0,cv.width,cv.height); } }
function confetti(){ fx(Array.from({length:190},()=>({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.35,vx:(Math.random()-.5)*17,vy:-Math.random()*14-4,g:.35,dr:.99,
  s:Math.random()*9+6,c:pick(RAIN),a:Math.random()*6,va:(Math.random()-.5)*.3,sh:Math.random()<.35?"star":"rect",life:150+Math.random()*40|0}))); }
function burst(x,y,cols=RAIN,n=18,sp=6){ fx(Array.from({length:n},(_,i)=>{ const a=i/n*Math.PI*2+Math.random()*.4, v=sp*(.5+Math.random()*.7);
  return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.12,dr:.94,s:Math.random()*8+9,c:pick(cols),a:0,va:(Math.random()-.5)*.3,sh:"star",life:45+Math.random()*20|0}; })); }
function sparkle(x,y){ burst(x,y,["#FFFFFF","#57E1FF","#FFC21A","#FF6FB5"],7,2.6); }
function center(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; }
function floatText(x,y,txt,col){ if(RM.matches) return; const d=document.createElement("div"); d.className="floater"; d.textContent=txt;
  d.style.left=x+"px"; d.style.top=y+"px"; d.style.setProperty("--fc",col); document.body.appendChild(d); setTimeout(()=>d.remove(),1100); }
function bumpEl(el,cls="bump"){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function renderWallet(v=wallet()){ $("walletN").textContent=v; }
/* las estrellas ganadas vuelan hasta el contador de arriba */
function flyStars(from,k){
  if(!k) return; let shown=wallet()-k; renderWallet(shown);
  const [x0,y0]=center(from), [x1,y1]=center($("wallet"));
  for(let i=0;i<k;i++){ const s=document.createElement("div"); s.className="flystar"; s.innerHTML=starIco(true); document.body.appendChild(s);
    const mx=(x0+x1)/2+(Math.random()-.5)*220, my=Math.min(y0,y1)-90;
    const an=s.animate([{transform:`translate(${x0-22}px,${y0-22}px) scale(.3) rotate(0)`},{transform:`translate(${mx-22}px,${my-22}px) scale(1.5) rotate(180deg)`,offset:.45},{transform:`translate(${x1-22}px,${y1-22}px) scale(.7) rotate(360deg)`}],
      {duration:RM.matches?1:950,delay:i*260,easing:"ease-in-out",fill:"backwards"});
    an.onfinish=()=>{ s.remove(); renderWallet(++shown); bumpEl($("wallet")); tone(880+i*220,.14,"triangle",.1); sparkle(x1,y1); }; }
}
let toastT=null;
function toast(icon,txt){ let t=$("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.className="toast"; t.innerHTML=icon+`<span>${txt}</span>`; t.style.animation="none"; void t.offsetWidth; t.style.animation="";
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"),2800); }

function miniMap(rows,s=14){ let h=`<div class="mini" style="grid-template-columns:repeat(${rows[0].length},${s}px);--ms:${s}px">`;
  for(const row of rows) for(const ch of row) h+=`<i class="${ch==="#"?"r":ch==="."?"":ch}"></i>`; return h+"</div>"; }
function partIco(p){ return p===1?ICO.arrow("r"):p===2?ICO.brush():p===3?ICO.repeat():ICO.ifq(); }
function lockWhy(st){ return st.gate?`Primero terminá ${st.gate}`:st.prevLeft?`Primero terminá «${st.prevTitle}»`:`Necesitás ${st.g.need} estrellas de esta parte (tenés ${st.earned})`; }
function renderMenu(){
  $("heroBot").innerHTML=robotSVG(); $("logoBot").innerHTML=robotSVG(); renderWallet();
  $("total").innerHTML=starIco(true)+`${earned()} estrellas ganadas`;
  const GS=groupsNow(); let h="", i=0, fresh=false;
  for(const P of PARTS){
    /* una card por parte; cada grupo de niveles se abre por separado */
    const sts=GS.filter(s=>s.g.part===P.id), ms=MISSIONS.filter(m=>m.part===P.id), got=ms.reduce((a,m)=>a+(SAVE.stars[m.id]||0),0);
    h+=`<section class="grp" style="--gc:${P.c};--gl:${P.l}"><div class="grph">`+
      `<span class="gdot">${partIco(P.id)}</span><div><h3>Parte ${P.id} · ${P.title}</h3><span class="gsub">${P.sub}</span></div>`+
      `<span class="gprog">${starIco(true)} ${got} / ${ms.length*3}</span></div><div class="cards">`;
    for(const st of sts){
      const g=st.g, isNew=st.open&&!SAVE.seen.includes(g.id);
      if(isNew){ SAVE.seen.push(g.id); fresh=true; }
      const need=st.gate?`Terminá la Parte ${PARTS.find(p=>p.id===g.part).after.filter(p=>!partDone(SAVE.stars,p)).join(" y ")}`:st.prevLeft?"Terminá los anteriores":`Juntá ${g.need}${starIco(true)}`;
      h+=st.ms.map(m=>{ const k=SAVE.stars[m.id]||0;
        return `<button class="card${k===3?" s3":""}${st.open?"":" locked"}${isNew?" new":""}" data-id="${m.id}" data-why="${lockWhy(st)}" style="--i:${i++};--gc:${g.c};--gl:${g.l}"><span class="num">${m.num}</span>${miniMap(m.rows)}<h3>${m.title}</h3>`+
          (st.open?`<div class="stars">${starRow(k)}</div>`:`<span class="need">${need}</span><span class="lock">${ICO.lock()}</span>`)+`</button>`; }).join("");
    }
    h+=`</div></section>`;
  }
  /* card aparte: los desafíos extra, para los que terminan antes */
  const chGot=CHALLENGES.reduce((a,c)=>a+(SAVE.stars[c.id]||0),0);
  h+=`<section class="grp" style="--gc:#8B6CF0;--gl:#E6DFFF"><div class="grph">`+
    `<span class="gdot">${ICO.clock()}</span><div><h3>Desafíos extra</h3><span class="gsub">3 niveles seguidos, con cronómetro</span></div>`+
    `<span class="gprog">${starIco(true)} ${chGot} / ${CHALLENGES.length*3}</span></div>`;
  for(const ch of CHALLENGES){
    const open=chOpen(ch), isNew=open&&!SAVE.seen.includes(ch.id);
    if(isNew){ SAVE.seen.push(ch.id); fresh=true; }
    h+=chCard(ch,i++,open,isNew);
  }
  h+=`</section>`;
  $("parts").innerHTML=h;
  let c=`<button class="card make" id="makeBtn" style="--i:${i++}"><span class="plus">+</span><h3>Creá tu mapa</h3></button>`;
  if(SAVE.custom) c+=`<button class="card" data-id="custom" style="--i:${i}">${miniMap(SAVE.custom.rows)}<h3>Mi mapa</h3></button>`;
  $("cards3").innerHTML=c;
  if(fresh){ persist(); setTimeout(()=>{ confetti(); SND.unlock(); toast(ICO.unlock(),"¡Desbloqueaste niveles nuevos!"); },500); }
}
function chCard(ch,i,open,isNew){
  const k=SAVE.stars[ch.id]||0, best=SAVE.best[ch.id], why=`Terminá todos los niveles de la ${partName(ch.part)}`;
  return `<button class="chcard${open?"":" locked"}${k===3?" s3":""}${isNew?" new":""}" data-ch="${ch.id}" data-why="${why}" style="--i:${i}">`+
    `<span class="chico">${ICO.clock()}</span><div class="chtxt"><span class="chtag">Desafío extra</span><h3>${ch.title}</h3>`+
    `<span class="chsub">3 niveles seguidos · con cronómetro</span>`+
    (open?`<div class="chrow"><span class="stars">${starRow(k)}</span>${best!=null?`<span class="chbest">${ICO.clock()}Récord ${fmtTime(best)}</span>`:""}</div>`
         :`<span class="need">${ICO.lock("#9A5A00")}${why}</span>`)+
    `</div><div class="chmaps">${ch.levels.map(m=>miniMap(m.rows,9)).join("")}</div></button>`;
}

function buildBoard(holder,rows,withRobot,availW,availH,intro){
  const n=rows.length, m=rows[0].length;
  const cs=Math.max(34,Math.min(80,Math.floor(Math.min((availW-6)/m,(availH-6)/n))-3));
  holder.style.setProperty("--cs",cs+"px");
  let h=`<div class="cells${intro?" intro":""}" style="grid-template-columns:repeat(${m},var(--cs))">`;
  for(let r=0;r<n;r++) for(let c=0;c<m;c++){ const ch=rows[r][c];
    const inner=ch==="#"?rockSVG():ch==="E"?goalSVG():ch==="B"?batSVG():(ch==="R"&&!withRobot)?`<svg class="rsvg" viewBox="-50 -50 100 100" data-look="r">${robotSVG()}</svg>`:"";
    h+=`<div class="cell${(r+c)%2?" alt":""}${ch==="X"?" red":ch==="V"?" green":""}" data-r="${r}" data-c="${c}" style="--i:${r+c}">${inner}</div>`; }
  if(withRobot) h+=`<div class="robot noanim${intro?" drop":""}" id="bot" data-look="r"><div class="shadow"></div><div class="bob"><svg viewBox="-50 -50 100 100">${robotSVG()}</svg></div><span class="penmark">${ICO.brush()}</span></div>`;
  holder.innerHTML=h+"</div>";
  return cs+3; // paso entre casillas (incluye separación)
}

function startPlay(map){
  PROGS[map.id]=PROGS[map.id]||[];
  const S=startState(map), opt=optFor(map,shortest(map,S));
  const tools=map.tools??"r"; /* el mapa propio (cls 0) tiene repetir */
  G={map,rows:map.rows,n:map.rows.length,m:map.rows[0].length,nB:countB(map.rows),nX:cellsOf(map.rows,"X").length,nV:cellsOf(map.rows,"V").length,
     prog:PROGS[map.id],run:0,busy:false,ctx:null,S,tools,rep:tools.includes("r"),opt,max:limitFor(map,opt),hint:false};
  setTop(map.num||ICO.pencil(),map.ch?`Desafío · Nivel ${map.num} de 3`:map.title); renderTopStars();
  $("hintBtn").classList.toggle("hidden",!!map.ch||!!map.need);
  renderPalette(); show("game"); drawBoard(false,true); renderProg();
  const lim=`Podés usar hasta ${G.max} bloques`, toStar=hasE(map)?", después a la estrella":"";
  if(map.ch&&map.num===1){ const ch=CHALLENGES.find(c=>c.id===map.ch);
    say("",ICO.clock(),"El reloj mide cuánto tardás",`3 estrellas: menos de ${fmtTime(ch.t3)} · 2 estrellas: menos de ${fmtTime(ch.t2)}`); }
  else if(G.nV) say("",ICO.ifq("#11986A"),"Rojas: pintar · Verdes: bailar",`Usá el bloque si y llegá a la estrella · ${lim}`);
  else if(G.nX&&tools.includes("i")) say("",ICO.ifq("#11986A"),"¡Pintá solo las rojas!",`Usá el bloque si y llegá a la estrella · ${lim}`);
  else if(G.nX) say("",ICO.brush("#7E3DB0"),G.nX>1?`Pintá las ${G.nX} celdas rojas`:"Pintá la celda roja",`Usá el pincel en las rojas y guardalo en las blancas${toStar} · ${lim}`);
  else if(map.need) say("",ICO.brush("#7E3DB0"),`Llegá a la estrella pintando ${map.need} celdas`,"Usá el pincel: mientras lo usás, pinta todo por donde pasa");
  else if(G.nB) say("",ICO.bat(),G.nB>1?`Juntá las ${G.nB} baterías`:"Primero la batería",`Después, a la estrella · ${lim}`);

/* ---------- arrastrar y soltar ---------- */
let D=null;
document.addEventListener("pointerdown",e=>{
  if(e.button!==0||!G||G.busy||SCREEN!=="game"||e.target.closest("button")) return;
  const el=e.target.closest(".blk"); if(!el||el.classList.contains("hat")) return;
  const inPal=!!el.closest("#pal"); if(!inPal&&!el.closest("#canvas")) return;
  e.preventDefault();
  const r=el.getBoundingClientRect();
  D={inPal,kind:el.dataset.new,addr:el.dataset.a,x0:e.clientX,y0:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,started:false};
  addEventListener("pointermove",onMove); addEventListener("pointerup",onUp); addEventListener("pointercancel",onUp);
});
function startDrag(){
  if(D.inPal){ D.block=newBlock(D.kind); if(tooMany(countBlocks([D.block]))){ D=null; return; } }
  else { const a=toArr(D.addr); D.from={path:a.slice(0,-1),i:a[a.length-1]}; D.block=removeAt(a); renderProg(); }
  D.started=true;
  const g=document.createElement("div"); g.className="ghost"; g.innerHTML=blockHTML(D.block,"g",false); document.body.appendChild(g); D.ghost=g;
  document.body.classList.add("dragging"); SND.pick();
}
function onMove(e){
  if(!D) return;
  if(!D.started){ if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<6) return; startDrag(); if(!D) return; }
  const gx=e.clientX-D.ox, gy=e.clientY-D.oy; D.ghost.style.transform=`translate(${gx}px,${gy}px)`;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  D.zone=!t?null:(t.closest("#trash")||t.closest("#pal"))?"del":t.closest("#script")?"drop":null;
  $("trash").classList.toggle("hot",D.zone==="del"); $("pal").classList.toggle("drop",D.zone==="del"&&!D.inPal);
  D.pt=D.zone==="drop"?nearestPoint(gx,gy):null; showDropline(D.pt);
}
function onUp(){
  removeEventListener("pointermove",onMove); removeEventListener("pointerup",onUp); removeEventListener("pointercancel",onUp);
  const d=D; D=null; if(!d) return;
  if(!d.started){ if(d.inPal&&!tooMany(1)){ G.prog.push(newBlock(d.kind)); SND.snap(); changed(); freshAt(G.prog.length-1); } return; }
  d.ghost.remove(); document.body.classList.remove("dragging"); $("trash").classList.remove("hot"); $("pal").classList.remove("drop");
  let at=null;
  if(d.zone==="drop"&&d.pt){ insertAt(d.pt.path,d.pt.i,d.block); at=d.pt.path.concat(d.pt.i).join("."); SND.snap(); }
  else if(d.zone==="del"){ if(!d.inPal){ SND.trash(); const [x,y]=center($("trash")); burst(x,y,["#FF5A62","#FF9A2E","#5F7F96"],10,4); } }
  else if(!d.inPal) insertAt(d.from.path,d.from.i,d.block);
  changed(); if(at!=null) freshAt(at);
}
/* lugares donde se puede enganchar un bloque: antes del primero y después de cada uno, en cada lista */
function nearestPoint(gx,gy){
  let best=null, bd=Infinity;
  document.querySelectorAll("#canvas .list").forEach(L=>{
    const path=toArr(L.dataset.l), kids=[...L.children].filter(k=>k.classList.contains("blk")), x=L.getBoundingClientRect().left;
    const pts=kids.length?[{i:0,y:kids[0].getBoundingClientRect().top},...kids.map((k,j)=>({i:j+1,y:k.getBoundingClientRect().bottom}))]:[{i:0,y:L.getBoundingClientRect().top}];
    for(const p of pts){ const d=Math.abs(gy-p.y)+Math.abs(gx-x)*.5; if(d<bd){ bd=d; best={path,i:p.i,x,y:p.y}; } }
  });
  return best;
}
function showDropline(p){ const el=$("dropline"); if(!el) return; el.classList.toggle("hidden",!p); if(!p) return;
  const cv=$("canvas"), cr=cv.getBoundingClientRect();

});
